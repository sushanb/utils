steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'reviewbot/Dockerfile',
      '-t', 'us-central1-docker.pkg.dev/${PROJECT_ID}/bigtable-utils/reviewbot:latest',
      '.'
    ]

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/${PROJECT_ID}/bigtable-utils/reviewbot:latest'
    ]

# Store the image path in the build results
images:
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/bigtable-utils/reviewbot:latest'

# Bigger builder because npm install of @anthropic-ai/claude-code + Go compile
# take longer than the default e2-standard-2 gives us.
options:
  machineType: E2_HIGHCPU_8

timeout: 900s
