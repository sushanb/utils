# GitHub App credentials for the reviewer bot.
#
# Apply once, before the CronJob. The private key is the .pem file GitHub gave
# you when you generated it under App settings → Private keys.
#
# Do NOT commit this file with real values. Options:
#   1) Populate it via `kubectl create secret generic ...` (shown below), OR
#   2) Use Secret Manager CSI driver so rotation propagates without redeploy.
#
# Manual apply (drop-in):
#
#   kubectl -n reviewbot create secret generic github-app \
#     --from-literal=app-id=<APP_ID> \
#     --from-literal=installation-id=<INSTALLATION_ID> \
#     --from-file=private-key.pem=./sushanb-review-bot.private-key.pem
#
# The keys must be named exactly: app-id, installation-id, private-key.pem
# (the CronJob mounts them at those names).

apiVersion: v1
kind: Secret
metadata:
  name: github-app
  namespace: reviewbot
type: Opaque
stringData:
  app-id: "REPLACE_ME"          # e.g. "1234567"
  installation-id: "REPLACE_ME" # e.g. "89012345"
data:
  # base64 of your .pem file — leave blank and use --from-file with kubectl
  # if you'd rather not paste it here.
  private-key.pem: ""
