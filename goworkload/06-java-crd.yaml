apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: javaworkloads.java.sushanb.com
spec:
  group: java.sushanb.com
  names:
    kind: JavaWorkload
    listKind: JavaWorkloadList
    plural: javaworkloads
    singular: javaworkload
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["projectID", "instanceID", "region", "replicas", "tableID", "serviceAccountName"] # <--- ADDED HERE
              properties:
                # --- NEW FIELDS ---
                projectID:
                  type: string
                  description: "Google Cloud Project ID"
                instanceID:
                  type: string
                  description: "Bigtable Instance ID"
                region:
                  type: string
                  description: "Google Cloud Region (e.g., us-central1)"
                tableID:
                  type: string
                  description: "Bigtable Instance ID"
                serviceAccountName:
                  type: string
                  description: "K8s Service Account to run the pod as"
                jvmArgs:
                  type: string
                appArgs:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
                env:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      value: {type: string}