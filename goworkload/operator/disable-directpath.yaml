apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: block-google-direct-path
  namespace: default
spec:
  # 1. Apply to ALL pods in the namespace
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # 2. Allow traffic to ALL IPs...
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        # 3. ...EXCEPT this specific range
        except:
        - 34.126.0.0/18